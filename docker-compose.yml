# AutoPrism V2 - local development

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      web:
        condition: service_healthy

  web:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/autoprism
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/autoprism
      - AI_API_BASE=${AI_API_BASE:-https://api.openai.com/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o}
      - REDIS_URL=redis://redis:6379/0
      - ARTIFACT_STORAGE_PATH=/data/artifacts
      - V2_AUTO_CREATE_SCHEMA=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - artifact_data:/data/artifacts
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/autoprism
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/autoprism
      - REDIS_URL=redis://redis:6379/0
      - ARTIFACT_STORAGE_PATH=/data/artifacts
      - V2_AUTO_CREATE_SCHEMA=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - artifact_data:/data/artifacts
    command: python -m app.worker

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=autoprism
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoprism"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  artifact_data:
